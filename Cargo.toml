[package]
name = "dusk"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A logout and power menu for Wayland compositors"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "1ba38527f375b5444141dec55af1b387b56316d6", default-features = false, features = [
  "accessibility",
  "dbus",
  "embedded-fonts",
  "svg",
] }
kdl = "6.7"
serde_json = "1"
libc = "0.2"
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Feature unification only: Rune pulls Fontique's system fonts, and this makes the Fontconfig
# backend load at run time instead of requiring its development files at build time.
fontique = { version = "0.13", default-features = false, features = [
  "system",
  "fontconfig-dlopen",
] }

[dev-dependencies]
# `service` adds the object server and interface macros used by the mock-logind tests.
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true

[patch.crates-io]
# A dependency's `[patch]` does not apply to the app, so dusk repeats Rune's vendor set.
# parley_engine carries the `line-dictionaries` feature; winit and sctk-adwaita carry the
# Wayland corner-radius extension; accesskit_* are the backends Rune builds against.
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "1ba38527f375b5444141dec55af1b387b56316d6" }
winit = { git = "https://github.com/anomalyco/rune", rev = "1ba38527f375b5444141dec55af1b387b56316d6" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "1ba38527f375b5444141dec55af1b387b56316d6" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "1ba38527f375b5444141dec55af1b387b56316d6" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "1ba38527f375b5444141dec55af1b387b56316d6" }
