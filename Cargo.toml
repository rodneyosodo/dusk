[package]
name = "dusk"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A logout and power menu for Hyprland"

[dependencies]
rune = { git = "https://github.com/rodneyosodo/rune", rev = "841b58aede1c55b26bda049145b26e54a2b5617b", default-features = false, features = [
  "accessibility",
  "dbus",
  "embedded-fonts",
  "svg",
] }
kdl = "6.7"
serde_json = "1"
libc = "0.2"
zbus = { version = "6", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
