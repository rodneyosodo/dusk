[package]
name = "dusk"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A logout and power menu for Wayland compositors"

[dependencies]
rune = { git = "https://github.com/rodneyosodo/rune", rev = "c2487b991f354769681f051b4805a6b4693152b8", default-features = false, features = [
  "accessibility",
  "dbus",
  "embedded-fonts",
  "svg",
] }
kdl = "6.7"
serde_json = "1"
libc = "0.2"
zbus = { version = "6", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
# `service` adds the object server and interface macros used by the mock-logind tests.
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
